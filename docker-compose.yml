version: '3.8'

services:
  db:
    image: postgres:15
    container_name: stayease_db_container
    restart: always
    environment:
      POSTGRES_USER: stayease_user
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_DB: stayease_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: stayease_app
    ports:
      - "8010:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://stayease_user:your_secure_password@db:5432/stayease_db
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      - db

volumes:
  postgres_data:
